apiVersion: v1
kind: Service
metadata:
  name: pihole-nodeport
  namespace: pihole
spec:
  type: NodePort
  selector:
    app: pihole
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
    - name: dns
      port: 53
      targetPort: 53
      nodePort: 30053